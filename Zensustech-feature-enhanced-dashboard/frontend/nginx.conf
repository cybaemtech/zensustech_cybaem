server {
    listen 80;

    # Serve the static UI files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # PROXY THE API CALLS TO THE BACKEND
    location /api {
    proxy_pass http://backend:8000;
    
    # Timeouts: Give the Azure/Microsoft call time to finish
    proxy_connect_timeout       60s;
    proxy_send_timeout          60s;
    proxy_read_timeout          60s;

    # Buffer settings: Handle the large token headers from Microsoft
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size 256k;
    # Add this to ensure large headers aren't dropped
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;

    # Standard Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Crucial for sessions
    proxy_set_header Cookie $http_cookie; 
    proxy_pass_header Set-Cookie;
    proxy_cookie_path / /;
    }
}